name: Keep Alive

on:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Create ping file
        run: |
          echo "$(date)" > ping.txt
          git config --global user.email "bot@github.com"
          git config --global user.name "KeepAliveBot"
          git add ping.txt
          git commit -m "ping $(date)" || echo "no changes"
          git push
