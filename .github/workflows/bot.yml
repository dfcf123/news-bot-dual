name: News Bot

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TG_BOT_TOKEN_WORLD: ${{ secrets.TG_BOT_TOKEN_WORLD }}
          TG_BOT_TOKEN_KRIM: ${{ secrets.TG_BOT_TOKEN_KRIM }}
          TG_CHAT_WORLD: ${{ secrets.TG_CHAT_WORLD }}
          TG_CHAT_KRIM: ${{ secrets.TG_CHAT_KRIM }}
        run: python bot.py

      - name: Save history
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "NewsBot"
          git add published_world.txt published_kriminal.txt
          git diff --cached --quiet || git commit -m "update history $(date)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
